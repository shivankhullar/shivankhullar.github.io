{{/*
  Individual paper pages (loaded into <head> by the theme's head-end hook). The page layout itself is
  layouts/publication/single.html; the Publications list page has its own styles in
  layouts/publication/list.html.
*/}}
{{ if and (eq .Section "publication") (eq .Kind "page") }}
<style>
  /* Bold the site owner's name in the author line. The theme only shows an avatar next to authors
     with a profile (content/authors/admin), so the name next to an avatar is the owner's.
     (On the list page, `highlight_name: true` in that profile already bolds it.) */
  .page-body .group > img.rounded-full + div { font-weight: 700; }

  /* Featured figure fills the page column; portrait figures are capped to the screen height instead. */
  .page-body .featured-image { width: 100%; height: auto; }
  .page-body .featured-image.featured-tall { width: auto; max-width: 100%; max-height: 85vh; }

  /* Tag pills: the theme puts them in one non-wrapping row, which squeezes long tags into tall boxes
     and runs off both edges of a phone screen. Let the row wrap. */
  .page-body div.flex.justify-center:has(> a.bg-primary-100) { flex-wrap: wrap; row-gap: .5rem; }
  .page-body div.flex.justify-center > a.bg-primary-100 { white-space: nowrap; }

  /* Caption below the figure instead of a translucent strip over its bottom edge. */
  .page-body .article-header-caption {
    position: static; display: block; opacity: 1; background: none; border-radius: 0;
    color: rgba(229, 231, 235, .9); text-align: left; font-size: .9rem; line-height: 1.55;
    padding: .9rem 0 0;
  }
</style>
{{ end }}
